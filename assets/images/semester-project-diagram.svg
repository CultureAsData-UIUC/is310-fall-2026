<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .milestone-box { fill: #f0f4f8; stroke: #2c3e50; stroke-width: 2; }
      .milestone-box-individual { fill: #fef5e7; stroke: #e67e22; stroke-width: 2; }
      .milestone-box-group { fill: #e8f4f8; stroke: #16a085; stroke-width: 2; }
      .milestone-title { font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .milestone-date { font-size: 13px; fill: #7f8c8d; }
      .milestone-deliverables { font-size: 12px; fill: #34495e; }
      .grade-badge { fill: #3498db; stroke: #2c3e50; stroke-width: 1.5; }
      .grade-text { font-size: 14px; font-weight: bold; fill: white; }
      .arrow { stroke: #34495e; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .section-label { font-size: 14px; font-weight: bold; fill: #2c3e50; }
      .header { font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .work-type-label { font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 3px; }
      .individual-label { fill: white; font-size: 11px; font-weight: bold; }
      .group-label { fill: white; font-size: 11px; font-weight: bold; }
      .code-note { font-size: 11px; fill: #c0392b; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" class="header">Semester Project Milestones</text>

  <!-- Legend -->
  <rect x="50" y="45" width="18" height="18" fill="#e8f4f8" stroke="#16a085" stroke-width="1"/>
  <text x="75" y="57" font-size="12" fill="#2c3e50">GROUP work</text>

  <rect x="240" y="45" width="18" height="18" fill="#fef5e7" stroke="#e67e22" stroke-width="1"/>
  <text x="265" y="57" font-size="12" fill="#2c3e50">INDIVIDUAL work</text>

  <rect x="480" y="45" width="18" height="18" fill="#f0f4f8" stroke="#2c3e50" stroke-width="1"/>
  <text x="505" y="57" font-size="12" fill="#2c3e50">MIXED</text>

  <!-- Timeline line -->
  <line x1="100" y1="95" x2="1100" y2="95" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Milestone 1: Topic Selection (GROUP) -->
  <rect x="50" y="115" width="200" height="200" rx="8" class="milestone-box-group"/>
  <rect x="70" y="130" width="160" height="25" fill="#16a085" rx="3"/>
  <text x="150" y="150" text-anchor="middle" class="individual-label">GROUP WORK</text>

  <text x="150" y="170" text-anchor="middle" class="milestone-title">Topic Selection</text>
  <text x="150" y="190" text-anchor="middle" class="milestone-date">Feb 5 (Ext: Feb 12)</text>
  <rect x="70" y="205" width="160" height="90" fill="#ffffff" stroke="#ecf0f1" stroke-width="1" rx="4"/>
  <text x="80" y="222" class="milestone-deliverables" font-weight="bold">Deliverables:</text>
  <text x="80" y="242" class="milestone-deliverables">• Group theme</text>
  <text x="80" y="260" class="milestone-deliverables">• Individual ideas</text>
  <text x="80" y="278" class="milestone-deliverables">• Collaboration plan</text>
  <circle cx="175" cy="315" r="22" class="grade-badge"/>
  <text x="175" y="322" text-anchor="middle" class="grade-text">P/F</text>

  <!-- Arrow 1 -->
  <path d="M 250 165 L 320 165" class="arrow"/>

  <!-- Milestone 2: Initial Dataset (INDIVIDUAL) -->
  <rect x="320" y="115" width="220" height="220" rx="8" class="milestone-box-individual"/>
  <rect x="340" y="130" width="180" height="25" fill="#e67e22" rx="3"/>
  <text x="430" y="150" text-anchor="middle" class="individual-label">INDIVIDUAL WORK</text>

  <text x="430" y="170" text-anchor="middle" class="milestone-title">Initial Dataset</text>
  <text x="430" y="190" text-anchor="middle" class="milestone-date">Mar 12 (Ext: Mar 24)</text>
  <rect x="340" y="205" width="180" height="110" fill="#ffffff" stroke="#ecf0f1" stroke-width="1" rx="4"/>
  <text x="350" y="222" class="milestone-deliverables" font-weight="bold">Deliverables:</text>
  <text x="350" y="242" class="milestone-deliverables">• 50-100 item dataset</text>
  <text x="350" y="260" class="milestone-deliverables">• Documentation</text>
  <text x="350" y="278" class="milestone-deliverables">• Next steps plan</text>
  <text x="350" y="298" class="code-note">+ Code used to assist</text>
  <circle cx="455" cy="330" r="22" class="grade-badge"/>
  <text x="455" y="337" text-anchor="middle" class="grade-text">15%</text>

  <!-- Arrow 2 -->
  <path d="M 540 165 L 610 165" class="arrow"/>

  <!-- Milestone 3: Data Demo Day (GROUP) -->
  <rect x="610" y="115" width="220" height="200" rx="8" class="milestone-box-group"/>
  <rect x="630" y="130" width="180" height="25" fill="#16a085" rx="3"/>
  <text x="720" y="150" text-anchor="middle" class="individual-label">GROUP WORK</text>

  <text x="720" y="170" text-anchor="middle" class="milestone-title">Data Demo Day</text>
  <text x="720" y="190" text-anchor="middle" class="milestone-date">Apr 30 or May 5</text>
  <rect x="630" y="205" width="180" height="90" fill="#ffffff" stroke="#ecf0f1" stroke-width="1" rx="4"/>
  <text x="640" y="222" class="milestone-deliverables" font-weight="bold">Deliverables:</text>
  <text x="640" y="242" class="milestone-deliverables">• Group presentation</text>
  <text x="640" y="260" class="milestone-deliverables">• Computational</text>
  <text x="640" y="278" class="milestone-deliverables">  experiments &amp; demos</text>
  <circle cx="745" cy="315" r="22" class="grade-badge"/>
  <text x="745" y="322" text-anchor="middle" class="grade-text">5%</text>

  <!-- Arrow 3 -->
  <path d="M 830 165 L 900 165" class="arrow"/>

  <!-- Milestone 4: Final Submission (MIXED) -->
  <rect x="900" y="115" width="250" height="200" rx="8" class="milestone-box"/>
  <rect x="920" y="130" width="210" height="25" fill="#34495e" rx="3"/>
  <text x="1025" y="150" text-anchor="middle" class="individual-label">INDIVIDUAL (25%) + GROUP (5%)</text>

  <text x="1025" y="170" text-anchor="middle" class="milestone-title">Final Submission</text>
  <text x="1025" y="190" text-anchor="middle" class="milestone-date">May 15 (NO EXT)</text>
  <rect x="920" y="205" width="210" height="90" fill="#ffffff" stroke="#ecf0f1" stroke-width="1" rx="4"/>
  <text x="930" y="222" class="milestone-deliverables" font-weight="bold">Individual:</text>
  <text x="930" y="242" class="milestone-deliverables">• Scaled dataset + docs</text>
  <text x="930" y="260" class="milestone-deliverables">• Data essay</text>
  <text x="930" y="278" class="milestone-deliverables">Group: Principles doc</text>
  <circle cx="1050" cy="315" r="22" class="grade-badge"/>
  <text x="1050" y="322" text-anchor="middle" class="grade-text">30%</text>

  <!-- Key activities section -->
  <rect x="50" y="360" width="1100" height="480" fill="none" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="3,3" rx="8"/>

  <text x="70" y="390" class="section-label">What You'll Be Doing Between Milestones:</text>

  <!-- Between Topic Selection and Initial Dataset -->
  <rect x="70" y="410" width="240" height="180" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="6"/>
  <text x="80" y="430" class="section-label">Feb-Mar</text>
  <text x="80" y="452" class="milestone-deliverables" font-weight="bold">INDIVIDUAL:</text>
  <text x="85" y="470" class="milestone-deliverables">→ Decide your approach:</text>
  <text x="95" y="487" class="milestone-deliverables">• Create from scratch, OR</text>
  <text x="95" y="504" class="milestone-deliverables">• Audit &amp; augment existing</text>
  <text x="85" y="522" class="milestone-deliverables">→ Manually create ~50-100 items</text>
  <text x="85" y="539" class="milestone-deliverables">→ Use code/tools to assist</text>
  <text x="85" y="556" class="milestone-deliverables">  (APIs, web scraping, regex,</text>
  <text x="85" y="573" class="milestone-deliverables">  image models, LLMs, etc.)</text>

  <!-- Between Initial Dataset and Demo Day -->
  <rect x="330" y="410" width="240" height="180" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="6"/>
  <text x="340" y="430" class="section-label">Mar-Apr</text>
  <text x="340" y="452" class="milestone-deliverables" font-weight="bold">INDIVIDUAL:</text>
  <text x="345" y="470" class="milestone-deliverables">→ SPRING BREAK</text>
  <text x="345" y="487" class="milestone-deliverables">→ Implement your plan:</text>
  <text x="355" y="504" class="milestone-deliverables">• Scale to 500-1,000+ items, OR</text>
  <text x="355" y="521" class="milestone-deliverables">• Combine with existing dataset</text>
  <text x="345" y="539" class="milestone-deliverables">→ Write code to process at scale</text>
  <text x="345" y="556" class="milestone-deliverables">→ Experiment with methods</text>
  <text x="345" y="573" class="milestone-deliverables">→ Prepare demo/presentation</text>

  <!-- Between Demo Day and Final -->
  <rect x="590" y="410" width="240" height="180" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="6"/>
  <text x="600" y="430" class="section-label">May</text>
  <text x="600" y="452" class="milestone-deliverables" font-weight="bold">INDIVIDUAL:</text>
  <text x="605" y="470" class="milestone-deliverables">→ Finalize your dataset</text>
  <text x="605" y="487" class="milestone-deliverables">→ Write data essay:</text>
  <text x="615" y="504" class="milestone-deliverables">• Your interpretive choices</text>
  <text x="615" y="521" class="milestone-deliverables">• Code/tools used</text>
  <text x="615" y="538" class="milestone-deliverables">• Ethical considerations</text>
  <text x="605" y="556" class="milestone-deliverables" font-weight="bold">GROUP:</text>
  <text x="605" y="573" class="milestone-deliverables">→ Write shared principles doc</text>

  <!-- Grading Summary -->
  <rect x="860" y="410" width="240" height="180" fill="#ecf0f1" stroke="#3498db" stroke-width="2" rx="6"/>
  <text x="880" y="430" class="section-label">Grade Breakdown</text>
  <line x1="880" y1="438" x2="1080" y2="438" stroke="#bdc3c7" stroke-width="1"/>
  <text x="880" y="462" class="milestone-deliverables">P/F: Topic Selection</text>
  <text x="880" y="482" class="milestone-deliverables">15%: Initial Dataset</text>
  <text x="880" y="502" class="milestone-deliverables">5%: Data Demo Day</text>
  <text x="880" y="522" class="milestone-deliverables">25%: Individual essay/data</text>
  <text x="880" y="542" class="milestone-deliverables">5%: Group principles doc</text>
  <text x="880" y="567" class="milestone-deliverables" font-weight="bold">Total: 50% of course</text>

  <!-- Important Notes -->
  <rect x="70" y="620" width="1030" height="130" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="6"/>
  <text x="90" y="645" class="section-label">📝 Important Notes:</text>

  <text x="90" y="670" class="milestone-deliverables" font-weight="bold">Code Documentation:</text>
  <text x="90" y="688" class="milestone-deliverables">Any code you use to create, augment, or analyze your dataset should be submitted and documented appropriately.</text>
  <text x="90" y="705" class="milestone-deliverables">This includes Python scripts, Jupyter notebooks, regex patterns, API calls, web scraping code, etc.</text>

  <text x="90" y="730" class="milestone-deliverables" font-weight="bold">All submissions go in your group's GitHub repository</text>
</svg>