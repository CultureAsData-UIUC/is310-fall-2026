<button
  id="resource-sidebar-toggle"
  class="btn btn-sm"
  type="button"
  aria-pressed="false"
  aria-label="Hide navigation and table of contents sidebars"
>
  <i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i>
  <span>Hide sidebars</span>
</button>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const button = document.getElementById("resource-sidebar-toggle");
  const isResourcePage = window.location.pathname.includes("/materials/");

  if (!button || !isResourcePage) {
    if (button) {
      button.remove();
    }
    return;
  }

  const label = button.querySelector("span");
  const icon = button.querySelector("i");

  function readerModeIsActive() {
    return window.localStorage.getItem("quarto-reader-mode") === "true";
  }

  function updateButton() {
    const sidebarsHidden = readerModeIsActive();
    button.setAttribute("aria-pressed", String(sidebarsHidden));
    button.setAttribute(
      "aria-label",
      sidebarsHidden
        ? "Show navigation and table of contents sidebars"
        : "Hide navigation and table of contents sidebars"
    );
    label.textContent = sidebarsHidden ? "Show sidebars" : "Hide sidebars";
    icon.className = sidebarsHidden
      ? "bi bi-layout-sidebar"
      : "bi bi-layout-sidebar-inset";
  }

  button.addEventListener("click", function () {
    window.quartoToggleReader();
    window.setTimeout(updateButton, 50);
  });

  updateButton();
});
</script>
